<h1 class="font-headline-lg text-headline-lg text-on-surface text-center tracking-tight">Lapor Lab</h1>

<div class="bg-surface-container rounded-xl shadow-md p-unit-4 flex flex-col gap-unit-4 w-full max-w-md mx-auto">

</div>

<div class="flex flex-col gap-unit-1 relative">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Lupa Password?</a>
</div>
<div class="relative flex items-center group">
<span aria-hidden="true" class="material-symbols-outlined absolute left-unit-3 text-on-surface-variant z-10">lock</span>
<input class="w-full bg-surface-container-lowest text-on-surface font-body-md text-body-md rounded-lg py-unit-3 pl-12 pr-12 shadow-sm focus:outline-none focus:ring-2 focus:ring-primary transition-shadow" id="password" placeholder="Masukkan password Anda" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-unit-3 text-on-surface-variant hover:text-on-surface transition-colors focus:outline-none flex items-center justify-center w-8 h-8 rounded-full z-10" id="togglePassword" type="button">
<span class="material-symbols-outlined" id="toggleIcon">visibility_off</span>
</button>

      <span aria-hidden="true" class="material-symbols-outlined text-[20px]">login</span>
</button>
</div>

    </p>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const toggleBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.getElementById('toggleIcon');

    if(toggleBtn && passwordInput && toggleIcon) {
      toggleBtn.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
      });
    }
  });
</script></main></body></html>
