<script>
    // Micro-interaction: Visual feedback on Cholesterol input
    const cholInput = document.querySelector('input[placeholder="0"]'); // Selecting the Kolesterol one loosely for demo
    const cholInputs = document.querySelectorAll('input[type="number"]');
    
    cholInputs.forEach(input => {
        if(input.parentElement.previousElementSibling.textContent.includes('Kolesterol')){
            input.addEventListener('input', (e) => {
                const val = parseInt(e.target.value) || 0;
                const bar = document.getElementById('chol-bar');
                if(bar) {
                    let pct = Math.min((val / 300) * 100, 100);
                    bar.style.width = pct + '%';
                    
                    if(val > 200) {
                        bar.classList.add('bg-error');
                        bar.classList.remove('bg-surface-variant', 'bg-primary');
                    } else if (val > 0) {
                         bar.classList.add('bg-primary');
                         bar.classList.remove('bg-error', 'bg-surface-variant');
                    } else {
                        bar.classList.add('bg-surface-variant');
                         bar.classList.remove('bg-error', 'bg-primary');
                    }
                }
            });
        }
    });
